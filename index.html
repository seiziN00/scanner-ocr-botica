<script>
    // Referencias a elementos de la cámara
    const videoFeed = document.getElementById('video-feed');
    const captureCanvas = document.getElementById('capture-canvas');
    const photoPreview = document.getElementById('photo-preview');
    const cameraSection = document.getElementById('camera-section');
    const startCameraBtn = document.getElementById('start-camera-btn');
    
    let streamMedia = null;
    let base64ImageParams = "";

    // --- FUNCIONES DE LA CÁMARA IN-APP ---

    async function iniciarCamara() {
        detenerCamara(); // Asegurar que no haya flujos abiertos
        
        // Ocultar resultados anteriores si existen
        document.getElementById('seccionResultado').classList.add('ocultar');

        try {
            // Se usa 'environment' para pedir permiso a la cámara trasera
            streamMedia = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: "environment",
                    width: { ideal: 1920 }, // Para alta resolución
                    height: { ideal: 1080 }
                },
                audio: false
            });
            
            // Mostrar flujo de video
            videoFeed.srcObject = streamMedia;
            cameraSection.classList.remove('ocultar');
            startCameraBtn.classList.add('ocultar');
            
        } catch (err) {
            console.error("Error al acceder a la cámara:", err);
            alert("No se pudo acceder a la cámara. Asegúrate de dar permisos o usar HTTPS.\nError: " + err.message);
        }
    }

    function detenerCamara() {
        if (streamMedia) {
            streamMedia.getTracks().forEach(track => track.stop());
            streamMedia = null;
        }
        cameraSection.classList.add('ocultar');
        startCameraBtn.classList.remove('ocultar');
    }

    function capturarFoto() {
        if (!streamMedia) return;

        // Configurar el canvas para que coincida con el tamaño real del video
        captureCanvas.width = videoFeed.videoWidth;
        captureCanvas.height = videoFeed.videoHeight;

        // Dibujar el frame actual del video en el canvas
        const context = captureCanvas.getContext('2d');
        context.drawImage(videoFeed, 0, 0, captureCanvas.width, captureCanvas.height);

        // Convertir a base64 (JPEG para mejor compresión)
        base64ImageParams = captureCanvas.toDataURL('image/jpeg', 0.85);
        
        // Mostrar vista previa de la foto tomada
        photoPreview.src = base64ImageParams;

        // Apagar cámara y proceder a procesar
        detenerCamara();
        procesarFacturaIA();
    }


    // --- FUNCIONES DE PROCESAMIENTO OCR (IA) ---
    async function procesarFacturaIA() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert("Por favor ingresa tu API Key de OpenRouter primero.");
            // Volver a mostrar el botón de cámara si no había key
            startCameraBtn.classList.remove('ocultar');
            return;
        }

        // Mostrar cargando
        document.getElementById('loading').classList.remove('ocultar');
        document.getElementById('seccionResultado').classList.add('ocultar');

        const prompt = `
        Analiza esta imagen de una factura de compra de una botica. Es crucial que extraigas con precisión los datos de la tabla para una botica.
        
        Extrae todos los ítems de la tabla (exceptuando CODIGO, IGV y PESO si es que aparecen); devuélveme ÚNICAMENTE las filas en código HTML (etiquetas <tr>...</tr>). No incluyas <table> ni <tbody>.
        
        Cada fila debe incluir los siguientes 8 campos estrictamente dentro de elementos <input class="form-control form-control-sm table-input">:
        1. producto (name="producto[]")
        2. cantidad (name="cantidad[]")
        3. laboratorio (name="laboratorio[]")
        4. lote (name="lote[]")
        5. vencimiento (name="vencimiento[]")
        6. UND (name="UND[]")
        7. p. unit. (name="p-unit[]")
        8. p. total. (name="p-total[]")

        Añade una última celda <td> con un botón para eliminar la fila:
        <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">✕</button>

        Ejemplo exacto de formato por fila:
        <tr>
            <td><input type="text" name="producto[]" value="AZITROMICINA 200MG/5ML PPS x 30ML" class="form-control form-control-sm table-input"></td>
            <td><input type="number" name="cantidad[]" value="6" class="form-control form-control-sm table-input"></td>
            <td><input type="text" name="laboratorio[]" value="PORTUGAL" class="form-control form-control-sm table-input"></td>
            <td><input type="text" name="lote[]" value="2057806" class="form-control form-control-sm table-input"></td>
            <td><input type="text" name="vencimiento[]" value="2029-05-15" class="form-control form-control-sm table-input"></td>
            <td><input type="text" name="UND[]" value="FRASCO" class="form-control form-control-sm table-input"></td>
            <td><input type="number" name="p-unit[]" value="6.16" class="form-control form-control-sm table-input"></td>
            <td><input type="number" name="p-total[]" value="36.96" class="form-control form-control-sm table-input"></td>
            <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">✕</button></td>
        </tr>

        NOTA: Es posible que una factura tenga lote y vencimiento en una misma columna, debes separarlos en columnas sus columnas respectivas. También es posible que el vencimiento esté en la colummna descripción.
        NOTA: Es posible que no haya una columna con nombres de laboratorio, en todo caso se usará el logotipo de la factura como nombre de laboratorio.
        IMPORTANTE: Responde ÚNICAMENTE con las etiquetas <tr>. No incluyas bloques de código Markdown (\`\`\`html) ni explicaciones.
        `;

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free",
                    "messages": [
                        {
                            "role": "user",
                            "content": [
                                { "type": "text", "text": prompt },
                                { "type": "image_url", "image_url": { "url": base64ImageParams } }
                            ]
                        }
                    ],
                    "reasoning": {"enabled": false},
                    "temperature": 0.1
                })
            });

            const data = await response.json();
            
            if (data.error) throw new Error(data.error.message);

            let htmlFilas = data.choices[0].message.content;

            // Limpieza de seguridad por si el LLM incluye markdown
            htmlFilas = htmlFilas.replace(/```html/g, '').replace(/```/g, '').trim();

            // Insertar filas en la tabla
            document.getElementById('cuerpoTabla').innerHTML = htmlFilas;

            // Mostrar resultado final
            document.getElementById('loading').classList.add('ocultar');
            document.getElementById('seccionResultado').classList.remove('ocultar');

        } catch (error) {
            console.error("Error API:", error);
            alert("Error al procesar la factura con la IA: " + error.message);
            document.getElementById('loading').classList.add('ocultar');
            startCameraBtn.classList.remove('ocultar');
        }
    }

    // --- FUNCIONES AUXILIARES DE LA TABLA ---
    function agregarFila() {
        const tbody = document.getElementById('cuerpoTabla');
        const nuevaFila = document.createElement('tr');
        nuevaFila.innerHTML = `
            <td><input type="text" name="producto[]" class="form-control form-control-sm table-input"></td>
            <td><input type="number" name="cantidad[]" class="form-control form-control-sm table-input"></td>
            <td><input type="text" name="laboratorio[]" class="form-control form-control-sm table-input"></td>
            <td><input type="text" name="lote[]" class="form-control form-control-sm table-input"></td>
            <td><input type="text" name="vencimiento[]" class="form-control form-control-sm table-input"></td>
            <td><input type="text" name="UND[]" class="form-control form-control-sm table-input"></td>
            <td><input type="number" name="p-unit[]" class="form-control form-control-sm table-input"></td>
            <td><input type="number" name="p-total[]" class="form-control form-control-sm table-input"></td>
            <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">✕</button></td>
        `;
        tbody.appendChild(nuevaFila);
        // Ocultar mensaje de carga y mostrar tabla si estaba vacía
        document.getElementById('seccionResultado').classList.remove('ocultar');
    }

    function guardarDatos() {
        const form = document.getElementById('formFactura');
        const formData = new FormData(form);

        const productos = formData.getAll('producto[]');
        
        if (productos.length === 0) {
            alert("No hay datos para guardar.");
            return;
        }

        const cantidades       = formData.getAll('cantidad[]');
        const laboratorios     = formData.getAll('laboratorio[]');
        const lotes            = formData.getAll('lote[]');
        const vencimientos     = formData.getAll('vencimiento[]');
        const UNDs             = formData.getAll('UND[]');
        const preciosUnitarios = formData.getAll('p-unit[]');
        const preciosTotales   = formData.getAll('p-total[]');

        // Estructura JSON final validada por el usuario
        const datosValidados = productos.map((prod, index) => ({
            producto: prod,
            lote: lotes[index],
            vencimiento: vencimientos[index],
            laboratorio: laboratorios[index],
            cantidad: Number(cantidades[index]),
            precios_totales: Number(preciosTotales[index])
        }));

        console.log("DATOS FINALES VALIDADOS (Debería enviarse al backend y guardarse en BD):", datosValidados);
        
        alert(`¡Éxito! Se han procesado ${datosValidados.length} medicamentos de la botica.\n\nRevisa la consola web (F12) para ver el JSON que se enviaría a la base de datos de Django.`);
    }
</script>
